<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline • The Oklahoma Observer</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #faf7f1;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      flex-direction: column;
    }
    h1 {
      color: #0d3f95;
      font-size: 1.8em;
      margin-bottom: 0.5em;
    }
    p {
      max-width: 320px;
      line-height: 1.4;
    }
    .logo {
      width: 96px;
      height: 96px;
      margin-bottom: 1em;
    }
    button {
      margin-top: 1.2em;
      background: #0d3f95;
      color: #f7d56a;
      border: none;
      border-radius: 999px;
      padding: 0.6em 1.4em;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.25s ease;
    }
    button:hover {
      background: #0b2a66;
    }
    footer {
      position: absolute;
      bottom: 1em;
      width: 100%;
      text-align: center;
      font-size: 0.8em;
      color: #666;
    }
  </style>
</head>
<body>
  <img src="logo.png" alt="The Oklahoma Observer" class="logo">
  <h1>You’re Offline</h1>
  <p>The Oklahoma Observer content isn’t available right now.<br>
  Please reconnect to the Internet to continue reading.</p>

  <button id="retry">Retry Connection</button>

  <footer>© 2025 The Oklahoma Observer</footer>

  <script>
    // 🟢 offline.html — start of full file (logic section)
    const retryButton = document.getElementById('retry');

    function tryReconnect() {
      if (navigator.onLine) {
        location.reload();
      } else {
        retryButton.textContent = 'Still Offline — Retry Again';
        setTimeout(() => retryButton.textContent = 'Retry Connection', 3000);
      }
    }

    retryButton.addEventListener('click', tryReconnect);

    // Auto-reload as soon as connection is restored
    window.addEventListener('online', () => location.reload());
    // 🔴 offline.html — end of full file (logic section)
  </script>
</body>
</html>
